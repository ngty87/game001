<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コード当てクイズ (Chord Guessing Game)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --error: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 16px 0;
      text-align: center;
      color: var(--accent);
    }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 480px) {
      .settings-grid { grid-template-columns: 1fr; }
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    select {
      background: #0f172a;
      color: var(--text);
      border: 1px solid #475569;
      padding: 9px;
      border-radius: 6px;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
    }
    .score-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 0.9rem;
      background: #0f172a;
      padding: 8px 14px;
      border-radius: 6px;
    }
    .octave-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .btn-oct {
      background: #0f172a;
      border: 1px solid #475569;
      color: var(--text);
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-oct.active {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      border-color: var(--accent);
    }
    .play-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn-sound {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0f172a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-sound:hover { background: var(--accent-hover); color: #fff; }

    .group-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 12px 0 6px 0;
    }
    .choices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 8px;
    }
    .btn-choice {
      background: #0f172a;
      border: 1px solid #475569;
      color: var(--text);
      padding: 10px 6px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-choice:hover:not(:disabled) {
      border-color: var(--accent);
      background: #1e293b;
    }
    .btn-choice.selected {
      border-color: var(--accent);
      background: #0369a1;
      color: #fff;
    }
    .btn-choice.correct {
      background: var(--success) !important;
      border-color: var(--success) !important;
      color: #fff !important;
    }
    .btn-choice.incorrect {
      background: var(--error) !important;
      border-color: var(--error) !important;
      color: #fff !important;
    }

    .feedback-area {
      min-height: 52px;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      font-weight: 600;
      text-align: center;
    }
    .feedback-success { color: var(--success); }
    .feedback-error { color: var(--error); }
    .next-btn {
      margin-top: 10px;
      padding: 8px 20px;
      font-size: 0.9rem;
      border: none;
      border-radius: 6px;
      background: #475569;
      color: #fff;
      cursor: pointer;
    }
    .next-btn:hover { background: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>コード当てクイズ</h1>

    <div class="settings-grid">
      <div class="control-group">
        <label for="mode">出題レベル：</label>
        <select id="mode">
          <option value="level1">Lv.1 基本2種 (Maj, min / 白鍵ランダム)</option>
          <option value="level2">Lv.2 応用6種 (7, M7, m7, mM7, aug, sus4)</option>
          <option value="level3">Lv.3 完全当て (ルート白鍵 + 全種)</option>
          <option value="level4">Lv.4 完全マスター (全12キー + 全種)</option>
        </select>
      </div>
      <div class="control-group">
        <label for="timbre">音色 (楽器)：</label>
        <select id="timbre">
          <option value="piano">アコースティックピアノ風</option>
          <option value="organ">オルガン風 (豊かな倍音・持続音)</option>
        </select>
      </div>
    </div>

    <div class="octave-selector">
      <span>オクターブ設定:</span>
      <button class="btn-oct" data-oct="-12">-1 Oct (低音)</button>
      <button class="btn-oct active" data-oct="0">通常 (基準)</button>
      <button class="btn-oct" data-oct="12">+1 Oct (高音)</button>
    </div>

    <div class="score-bar">
      <span>問題: <strong id="question-count">1</strong> / 10</span>
      <span>正解数: <strong id="correct-count">0</strong></span>
    </div>

    <div class="play-controls">
      <button id="btn-play-chord" class="btn-sound">🔊 和音を鳴らす</button>
      <button id="btn-play-arpeggio" class="btn-sound" style="background:#0284c7; color:#fff;">🎵 アルペジオで鳴らす</button>
    </div>

    <div class="question-panel" id="question-panel"></div>
    <div class="feedback-area" id="feedback-area"></div>
  </div>

  <script>
    // --- 音階・コード定義 ---
    const NATURAL_NOTES = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
    const ALL_NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    
    // 各ルートのC3(48)からの半音オフセット
    const NOTE_OFFSETS = {
      'C': 0, 'C#': 1, 'D': 2, 'D#': 3, 'E': 4, 'F': 5,
      'F#': 6, 'G': 7, 'G#': 8, 'A': 9, 'A#': 10, 'B': 11
    };

    const CHORD_DEFS = {
      // Lv.1（ディミニッシュは除外）
      'major': { label: 'Major', intervals: [0, 4, 7], level: 1 },
      'minor': { label: 'minor (m)', intervals: [0, 3, 7], level: 1 },
      // Lv.2
      '7': { label: '7 (ドミナント)', intervals: [0, 4, 7, 10], level: 2 },
      'maj7': { label: 'M7 (メジャー7th)', intervals: [0, 4, 7, 11], level: 2 },
      'm7': { label: 'm7 (マイナー7th)', intervals: [0, 3, 7, 10], level: 2 },
      'mM7': { label: 'mM7 (マイナーM7th)', intervals: [0, 3, 7, 11], level: 2 },
      'aug': { label: 'aug (オーギュメント)', intervals: [0, 4, 8], level: 2 },
      'sus4': { label: 'sus4', intervals: [0, 5, 7], level: 2 }
    };

    // --- 音声合成エンジン (Web Audio API) ---
    let audioCtx = null;
    let octaveOffset = 0; // -12, 0, 12

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function midiToFreq(midiNote) {
      return 440 * Math.pow(2, (midiNote - 69) / 12);
    }

    // ピアノ風合成音（基音 + 第2・第3倍音 + 指数減衰）
    function playPianoTone(freq, startTime, duration = 1.6) {
      const ctx = getAudioContext();
      const partials = [
        { mult: 1, gain: 0.22, decay: duration },
        { mult: 2, gain: 0.10, decay: duration * 0.7 },
        { mult: 3, gain: 0.05, decay: duration * 0.5 }
      ];

      partials.forEach(p => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq * p.mult, startTime);

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(p.gain, startTime + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + p.decay);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(startTime);
        osc.stop(startTime + p.decay);
      });
    }

    // オルガン風合成音（加算合成 + 持続性）
    function playOrganTone(freq, startTime, duration = 1.3) {
      const ctx = getAudioContext();
      // オルガンのドローバー風倍音比率
      const harmonics = [
        { mult: 0.5, gain: 0.08 }, // 16'
        { mult: 1.0, gain: 0.18 }, // 8' (基音)
        { mult: 2.0, gain: 0.12 }, // 4'
        { mult: 3.0, gain: 0.07 }  // 2 2/3'
      ];

      harmonics.forEach(h => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq * h.mult, startTime);

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(h.gain, startTime + 0.04);
        gain.gain.setValueAtTime(h.gain, startTime + duration - 0.1);
        gain.gain.linearRampToValueAtTime(0.0001, startTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(startTime);
        osc.stop(startTime + duration);
      });
    }

    function playNote(freq, startTime, duration) {
      const timbre = document.getElementById('timbre').value;
      if (timbre === 'organ') {
        playOrganTone(freq, startTime, duration);
      } else {
        playPianoTone(freq, startTime, duration);
      }
    }

    function playChord(midiNotes, arpeggio = false) {
      const ctx = getAudioContext();
      const now = ctx.currentTime + 0.03;
      const timbre = document.getElementById('timbre').value;
      const baseDuration = (timbre === 'organ') ? 1.4 : 1.7;

      midiNotes.forEach((note, idx) => {
        const shiftedNote = note + octaveOffset;
        const start = arpeggio ? now + (idx * 0.16) : now;
        const dur = arpeggio ? 1.0 : baseDuration;
        playNote(midiToFreq(shiftedNote), start, dur);
      });
    }

    // --- ゲーム状態管理 ---
    let currentMode = 'level1';
    let questionIndex = 1;
    let correctCount = 0;
    const totalQuestions = 10;
    let currentQuestion = null;
    let answered = false;

    let selectedRoot = null;
    let selectedType = null;

    const modeSelect = document.getElementById('mode');
    const questionPanel = document.getElementById('question-panel');
    const feedbackArea = document.getElementById('feedback-area');
    const questionCountEl = document.getElementById('question-count');
    const correctCountEl = document.getElementById('correct-count');
    const btnPlayChord = document.getElementById('btn-play-chord');
    const btnPlayArpeggio = document.getElementById('btn-play-arpeggio');

    // オクターブボタンの設定
    document.querySelectorAll('.btn-oct').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-oct').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        octaveOffset = parseInt(btn.dataset.oct, 10);
        if (currentQuestion && !answered) {
          playChord(currentQuestion.midiNotes, false);
        }
      });
    });

    modeSelect.addEventListener('change', () => {
      currentMode = modeSelect.value;
      resetGame();
    });

    btnPlayChord.addEventListener('click', () => {
      if (currentQuestion) playChord(currentQuestion.midiNotes, false);
    });

    btnPlayArpeggio.addEventListener('click', () => {
      if (currentQuestion) playChord(currentQuestion.midiNotes, true);
    });

    function resetGame() {
      questionIndex = 1;
      correctCount = 0;
      questionCountEl.textContent = questionIndex;
      correctCountEl.textContent = correctCount;
      generateQuestion();
    }

    function generateQuestion() {
      answered = false;
      selectedRoot = null;
      selectedType = null;
      feedbackArea.innerHTML = '';
      questionCountEl.textContent = questionIndex;

      // 1. コード品質の候補決定
      let candidateTypes = [];
      if (currentMode === 'level1') {
        candidateTypes = ['major', 'minor'];
      } else if (currentMode === 'level2') {
        candidateTypes = Object.keys(CHORD_DEFS).filter(k => CHORD_DEFS[k].level === 2);
      } else {
        // Lv.3 & Lv.4: Lv1とLv2の全種
        candidateTypes = Object.keys(CHORD_DEFS);
      }

      const randomTypeKey = candidateTypes[Math.floor(Math.random() * candidateTypes.length)];
      const chordDef = CHORD_DEFS[randomTypeKey];

      // 2. ルート音の決定
      let rootPool = NATURAL_NOTES; // 基本は白鍵 (C, D, E, F, G, A, B)
      if (currentMode === 'level4') {
        rootPool = ALL_NOTES; // 全12音
      }

      const rootNoteName = rootPool[Math.floor(Math.random() * rootPool.length)];
      const baseMidi = 48 + NOTE_OFFSETS[rootNoteName]; // C3基準
      const midiNotes = chordDef.intervals.map(intv => baseMidi + intv);

      currentQuestion = {
        typeKey: randomTypeKey,
        typeName: chordDef.label,
        rootName: rootNoteName,
        midiNotes: midiNotes
      };

      renderUI();
      setTimeout(() => playChord(currentQuestion.midiNotes, false), 150);
    }

    function renderUI() {
      questionPanel.innerHTML = '';

      if (currentMode === 'level1' || currentMode === 'level2') {
        const grid = document.createElement('div');
        grid.className = 'choices-grid';

        const keys = (currentMode === 'level1')
          ? ['major', 'minor']
          : Object.keys(CHORD_DEFS).filter(k => CHORD_DEFS[k].level === 2);

        keys.forEach(k => {
          const btn = document.createElement('button');
          btn.className = 'btn-choice';
          btn.textContent = CHORD_DEFS[k].label;
          btn.onclick = () => checkAnswerDirect(k, btn);
          grid.appendChild(btn);
        });

        questionPanel.appendChild(grid);
      } else {
        // Lv.3 / Lv.4: ルート音 + コード品質の2段階選択
        const rootTitle = document.createElement('div');
        rootTitle.className = 'group-title';
        rootTitle.textContent = '1. ルート音（基音）を選択:';
        questionPanel.appendChild(rootTitle);

        const rootGrid = document.createElement('div');
        rootGrid.className = 'choices-grid';
        const rootsToDisplay = (currentMode === 'level3') ? NATURAL_NOTES : ALL_NOTES;

        rootsToDisplay.forEach(note => {
          const btn = document.createElement('button');
          btn.className = 'btn-choice';
          btn.textContent = note;
          btn.onclick = () => {
            if (answered) return;
            rootGrid.querySelectorAll('.btn-choice').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedRoot = note;
            checkFullAnswer();
          };
          rootGrid.appendChild(btn);
        });
        questionPanel.appendChild(rootGrid);

        const typeTitle = document.createElement('div');
        typeTitle.className = 'group-title';
        typeTitle.textContent = '2. コードの響きを選択:';
        questionPanel.appendChild(typeTitle);

        const typeGrid = document.createElement('div');
        typeGrid.className = 'choices-grid';
        Object.keys(CHORD_DEFS).forEach(k => {
          const btn = document.createElement('button');
          btn.className = 'btn-choice';
          btn.textContent = CHORD_DEFS[k].label;
          btn.onclick = () => {
            if (answered) return;
            typeGrid.querySelectorAll('.btn-choice').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedType = k;
            checkFullAnswer();
          };
          typeGrid.appendChild(btn);
        });
        questionPanel.appendChild(typeGrid);
      }
    }

    // Lv1 & Lv2 の回答判定
    function checkAnswerDirect(selectedKey, btn) {
      if (answered) return;
      answered = true;

      const isCorrect = (selectedKey === currentQuestion.typeKey);
      if (isCorrect) {
        btn.classList.add('correct');
        correctCount++;
        correctCountEl.textContent = correctCount;
        showFeedback(true, `正解！ (${currentQuestion.rootName} ${currentQuestion.typeName})`);
      } else {
        btn.classList.add('incorrect');
        const allBtns = questionPanel.querySelectorAll('.btn-choice');
        allBtns.forEach(b => {
          if (b.textContent === currentQuestion.typeName) b.classList.add('correct');
        });
        showFeedback(false, `残念！ 正解は「${currentQuestion.rootName} ${currentQuestion.typeName}」でした`);
      }
    }

    // Lv3 & Lv4 の回答判定
    function checkFullAnswer() {
      if (selectedRoot && selectedType && !answered) {
        answered = true;
        const isCorrect = (selectedRoot === currentQuestion.rootName && selectedType === currentQuestion.typeKey);
        const fullChordName = `${currentQuestion.rootName} ${currentQuestion.typeName}`;

        if (isCorrect) {
          correctCount++;
          correctCountEl.textContent = correctCount;
          showFeedback(true, `完全正解！ 「${fullChordName}」です！`);
        } else {
          showFeedback(false, `不正解！ 正解は「${fullChordName}」でした（あなたの回答: ${selectedRoot} ${CHORD_DEFS[selectedType].label}）`);
        }
      }
    }

    function showFeedback(isSuccess, message) {
      feedbackArea.innerHTML = `
        <div class="${isSuccess ? 'feedback-success' : 'feedback-error'}">${message}</div>
        <button class="next-btn" id="btn-next">${questionIndex < totalQuestions ? '次の問題へ' : '結果を見る'}</button>
      `;
      document.getElementById('btn-next').onclick = () => {
        if (questionIndex < totalQuestions) {
          questionIndex++;
          generateQuestion();
        } else {
          showFinalResult();
        }
      };
    }

    function showFinalResult() {
      questionPanel.innerHTML = '';
      feedbackArea.innerHTML = `
        <div style="font-size:1.2rem; margin-bottom:12px;">🎉 終了！ 成績: ${correctCount} / ${totalQuestions} 問正解</div>
        <button class="btn-sound" style="margin: 0 auto; max-width:200px;" onclick="resetGame()">もう一度遊ぶ</button>
      `;
    }

    // 初回起動
    generateQuestion();
  </script>
</body>
</html>
